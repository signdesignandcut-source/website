<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Design and Cut</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#fbfaf7;--fg:#1c1d1f;--muted:#5d6168;--accent:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--fg:#ecebe8;--muted:#a3a6ab;--accent:#f97316}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 20px;box-sizing:border-box}
h1{font-size:clamp(30px,6vw,48px);letter-spacing:-.02em;margin:0 0 8px}
h1 span{color:var(--accent)}
p{color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <h1>Sign Design <span>&amp;</span> Cut</h1>
  <p>Our new website is coming soon.</p>
</main>
</body>
</html>
